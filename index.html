<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Notifica Sismica Sottile</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      cursor: pointer;
    }
    /* Stile minimale: di default è quasi invisibile o un piccolo badge */
    #status {
      display: none; /* Nascosto finché tutto va bene per la massima pulizia */
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background-color: rgba(248, 215, 218, 0.9);
      color: #721c24;
      border: 1px solid #f5c6cb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      animation: pulse 1.5s infinite;
    }
    #status.visibile {
      display: inline-block;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body onclick="sbloccaAudio()">

  <!-- Messaggio visibile SOLO se il browser blocca l'audio -->
  <div id="status">🔇 Clicca qui per abilitare l'audio</div>

  <script>
    // INSERISCI QUI IL LINK DIRETTO AL FILE MP3 O WAV
    const AUDIO_URL = "https://tuodominio.it/path/al/suono.mp3";
    
    const audio = new Audio(AUDIO_URL);
    audio.preload = 'auto';
    const statusBox = document.getElementById('status');

    const params = new URLSearchParams(window.location.search);
    const currentId = params.get('id');
    const previousId = sessionStorage.getItem('ultimo_event_id');

    // Controllo nuovo terremoto
    if (currentId) {
      if (previousId && currentId !== previousId) {
        audio.play().catch(err => {
          // Se bloccato dal browser, mostra l'avviso minimale per consentire il click
          statusBox.className = 'visibile';
        });
      }
      sessionStorage.setItem('ultimo_event_id', currentId);
    }

    // Funzione di sblocco al primo click dell'utente
    function sbloccaAudio() {
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        statusBox.className = ''; // Nasconde l'avviso rendendo il widget pulito
      }).catch(e => {
        console.error("Errore:", e);
      });
    }
  </script>

</body>
</html>

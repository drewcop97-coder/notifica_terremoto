<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Notifica Sismica INGV</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #status {
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
    }
    #status.nascosto { display: none !important; }
    #btnTest {
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 11px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }
    #log {
      font-size: 11px;
      background: rgba(255,255,255,0.9);
      padding: 3px 6px;
      border-radius: 6px;
      color: #333;
    }
  </style>
</head>
<body>

  <div id="status" onclick="attivaAudio()">🔇 Clicca qui per abilitare l'audio</div>
  <button id="btnTest" onclick="simulaTerremoto()">🔔 Test</button>
  <span id="log">In attesa...</span>

  <script>
    const AUDIO_URL = "https://www.image2url.com/r2/default/audio/1795119985931-bfc559b7-1f06-4403-8735-f6deff3510d4.mp3";
    const INGV_URL = "https://webservices.ingv.it/fdsnws/event/1/query?limit=1&orderby=time&format=text";
    
    const audio = new Audio(AUDIO_URL);
    audio.preload = 'auto';
    const statusBox = document.getElementById('status');
    const logBox = document.getElementById('log');
    
    let audioAbilitato = false;
    let ultimoEventId = null;

    function attivaAudio() {
      statusBox.classList.add('nascosto');
      audio.muted = true;
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
        audioAbilitato = true;
        logBox.textContent = "Audio attivo!";
      }).catch(err => {
        audio.muted = false;
        logBox.textContent = "Errore sblocco: " + err.message;
      });
    }

    function simulaTerremoto() {
      logBox.textContent = "Test INGV...";
      ultimoEventId = "00000000";
      controllaTerremoti();
    }

    async function controllaTerremoti() {
      try {
        const urlNoCache = `${INGV_URL}&_=${Date.now()}`;
        const res = await fetch(urlNoCache);
        const text = await res.text();
        
        const righe = text.trim().split('\n');
        
        if (righe.length >= 2) {
          const colonne = righe[1].split(';');
          const eventIdAttuale = colonne[0].trim();
          const magnitudo = colonne[11] ? colonne[11].trim() : "";

          logBox.textContent = `ID: ${eventIdAttuale} (M ${magnitudo})`;

          if (ultimoEventId !== null && eventIdAttuale !== ultimoEventId) {
            if (audioAbilitato) {
              audio.currentTime = 0;
              audio.play().catch(e => logBox.textContent = "Errore play: " + e.message);
            } else {
              statusBox.classList.remove('nascosto');
            }
          }
          ultimoEventId = eventIdAttuale;
        }
      } catch (e) {
        logBox.textContent = "Errore INGV: " + e.message;
      }
    }

    controllaTerremoti();
    setInterval(controllaTerremoti, 15000);
  </script>
</body>
</html>

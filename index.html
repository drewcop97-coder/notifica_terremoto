<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Player Notifica Sismica</title>
  <style>
    body {
      margin: 0;
      padding: 4px;
      font-family: 'Segoe UI', sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      cursor: pointer;
    }
    #status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      background-color: rgba(255, 255, 255, 0.85);
      border: 1px solid #ccc;
      transition: 0.3s;
      text-align: center;
    }
    #status.attivo {
      color: #155724;
      background-color: #d4edda;
      border-color: #c3e6cb;
    }
    #status.bloccato {
      color: #721c24;
      background-color: #f8d7da;
      border-color: #f5c6cb;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body onclick="sbloccaAudio()">

  <div id="status">🔔 Notifiche audio pronte</div>

  <script>
    const AUDIO_URL = "https://image2url.com";
    const audio = new Audio(AUDIO_URL);
    const statusBox = document.getElementById('status');

    const params = new URLSearchParams(window.location.search);
    const currentId = params.get('id');
    const previousId = sessionStorage.getItem('ultimo_event_id');

    // Se cambia l'ID, prova SEMPRE a suonare in automatico
    if (currentId && previousId && currentId !== previousId) {
      audio.play().then(() => {
        statusBox.className = 'attivo';
        statusBox.innerHTML = "🔊 Nuovo evento rilevato!";
      }).catch(err => {
        // Se il browser blocca l'autoplay, avvisa l'utente di cliccare
        statusBox.className = 'bloccato';
        statusBox.innerHTML = "🔇 Clicca qui per abilitare l'audio";
      });
    }

    if (currentId) {
      sessionStorage.setItem('ultimo_event_id', currentId);
    }

    // Sblocca l'audio al primo click
    function sbloccaAudio() {
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        statusBox.className = 'attivo';
        statusBox.innerHTML = "🔊 Audio attivo";
      }).catch(e => console.error(e));
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Player Audio Sismico</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      cursor: pointer;
    }
    #status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background-color: rgba(248, 215, 218, 0.95);
      color: #721c24;
      border: 1px solid #f5c6cb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    #status.nascosto {
      display: none;
    }
  </style>
</head>
<body onclick="sbloccaAudio()">

  <div id="status">🔇 Clicca qui per abilitare l'audio</div>

  <script>
    const AUDIO_URL = "https://image2url.com";
    const audio = new Audio(AUDIO_URL);
    audio.preload = 'auto';
    const statusBox = document.getElementById('status');

    function sbloccaAudio() {
      audio.play().then(() => {
        setTimeout(() => {
          audio.pause();
          audio.currentTime = 0;
        }, 100);
        statusBox.className = 'nascosto';
      }).catch(e => console.error("Errore sblocco:", e));
    }

    // Ascolta i messaggi dal sensore.html sullo stesso dominio GitHub
    window.addEventListener('storage', (event) => {
      if (event.key === 'nuovo_terremoto_id' && event.newValue) {
        audio.currentTime = 0;
        audio.play().catch(err => {
          // Se per qualche motivo non era stato cliccato, mostra l'avviso
          statusBox.className = '';
        });
      }
    });
  </script>

</body>
</html>

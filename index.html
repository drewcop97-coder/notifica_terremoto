<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Player Audio Sismico</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #status {
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
    }
    #status.nascosto {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="status" onclick="sbloccaAudio()">🔇 Clicca qui per abilitare l'audio</div>

  <script>
    const AUDIO_URL = "https://image2url.com";
    const audio = new Audio(AUDIO_URL);
    audio.preload = 'auto';
    const statusBox = document.getElementById('status');

    function sbloccaAudio() {
      // 1. Nasconde subito il badge al clic dell'utente
      statusBox.classList.add('nascosto');

      // 2. Sblocca l'elemento Audio con volume a zero
      audio.muted = true;
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
      }).catch(e => {
        audio.muted = false;
        console.warn("Primo tentativo audio:", e);
      });
    }

    // Ascolta i messaggi dal sensore.html sullo stesso dominio GitHub
    window.addEventListener('storage', (event) => {
      if (event.key === 'nuovo_terremoto_id' && event.newValue) {
        audio.muted = false;
        audio.currentTime = 0;
        audio.play().catch(err => {
          // Se il browser blocca ancora, riappare il pulsante
          statusBox.classList.remove('nascosto');
          console.error("Riproduzione bloccata:", err);
        });
      }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Notifica Sismica INGV</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #status {
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background-color: rgba(248, 215, 218, 0.95);
      color: #721c24;
      border: 1px solid #f5c6cb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
    }
    #status.nascosto {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="status" onclick="attivaAudio()">🔇 Clicca qui per abilitare l'audio</div>

  <script>
    const ingvHost = ["webservices", "ingv", "it"].join(".");
    const ingvPath = ["fdsnws", "event", "1", "query"].join("/");
    const ingvQuery = "limit=1&orderby=time&format=text";
    const RAW_INGV_URL = "https://" + ingvHost + "/" + ingvPath + "?" + ingvQuery;
    
    const proxyHost = ["api", "allorigins", "win"].join(".");
    const PROXY_URL = "https://" + proxyHost + "/raw?url=" + encodeURIComponent(RAW_INGV_URL);
    
    const mioMp3 = new Audio(encodeURI("Nuovo evento sismico.MP3"));
    mioMp3.preload = 'auto';

    const statusBox = document.getElementById('status');
    
    let audioCtx = null;
    let audioAbilitato = false;
    let ultimoEventId = null;

    function suonaParacadute() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const frequenze = [523.25, 659.25];

        frequenze.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.25);
          gain.gain.setValueAtTime(0.3, now + i * 0.25);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.25 + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.25);
          osc.stop(now + i * 0.25 + 0.5);
        });

        if ('speechSynthesis' in window) {
          setTimeout(() => {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance("Nuovo evento sismico");
            msg.lang = "it-IT";
            msg.rate = 1.0;
            window.speechSynthesis.speak(msg);
          }, 550);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function riproduciAllerta() {
      mioMp3.currentTime = 0;
      mioMp3.play().catch(() => {
        suonaParacadute();
      });
    }

    function attivaAudio() {
      statusBox.classList.add('nascosto');
      
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();

      mioMp3.muted = true;
      mioMp3.play().then(() => {
        mioMp3.pause();
        mioMp3.currentTime = 0;
        mioMp3.muted = false;
      }).catch(() => {
        mioMp3.muted = false;
      });

      audioAbilitato = true;
    }

    async function controllaTerremoti() {
      try {
        const res = await fetch(PROXY_URL + "&_=" + Date.now());
        if (!res.ok) return;
        const text = await res.text();
        
        const righe = text.trim().split('\n');
        
        if (righe.length >= 2) {
          const colonne = righe[1].split('|');
          const eventIdAttuale = colonne[0].trim();

          if (ultimoEventId !== null && eventIdAttuale !== ultimoEventId) {
            if (audioAbilitato) {
              riproduciAllerta();
            } else {
              statusBox.classList.remove('nascosto');
            }
          }
          ultimoEventId = eventIdAttuale;
        }
      } catch (e) {
        // Ignora eventuali errori temporanei di rete
      }
    }

    controllaTerremoti();
    setInterval(controllaTerremoti, 15000);
  </script>
</body>
</html>

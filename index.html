<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Notifica Sismica ArcGIS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #status {
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
    }
    #status.nascosto {
      display: none !important;
    }
    #btnTest {
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 11px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="status" onclick="attivaAudio()">🔇 Clicca qui per abilitare l'audio</div>
  <button id="btnTest" onclick="simulaTerremoto()">🔔 Test</button>

  <script>
    const AUDIO_URL = "https://www.image2url.com/r2/default/audio/1795119985931-bfc559b7-1f06-4403-8735-f6deff3510d4.mp3";
    const LAYER_URL = "https://utility.arcgis.com/usrsvcs/servers/7d902cfd09864a8290a6e211dd58a097/rest/services/EventsList/FeatureServer/2"; 
    const queryUrl = `${LAYER_URL}/query?where=1%3D1&outFields=*&resultRecordCount=5&f=json`;
    
    const audio = new Audio(AUDIO_URL);
    audio.preload = 'auto';
    const statusBox = document.getElementById('status');
    
    let audioAbilitato = false;
    let firmaUltimiEventi = null;

    function attivaAudio() {
      statusBox.classList.add('nascosto');
      audio.muted = true;
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
        audioAbilitato = true;
      }).catch(err => {
        audio.muted = false;
        console.error("Errore audio:", err);
      });
    }

    // Funzione di test: simula l'arrivo di un nuovo dato dal layer ArcGIS
    function simulaTerremoto() {
      firmaUltimiEventi = "dato_vecchio_simulato";
      controllaTerremoti();
    }

    async function controllaTerremoti() {
      try {
        const res = await fetch(queryUrl);
        const data = await res.json();
        
        if (data.features && data.features.length > 0) {
          const firmaAttuale = JSON.stringify(data.features.map(f => f.attributes));
          
          if (firmaUltimiEventi !== null && firmaAttuale !== firmaUltimiEventi) {
            if (audioAbilitato) {
              audio.currentTime = 0;
              audio.play().catch(e => console.error("Errore play:", e));
            } else {
              statusBox.classList.remove('nascosto');
            }
          }
          firmaUltimiEventi = firmaAttuale;
        } else {
          console.warn("Nessun dato ricevuto dal layer:", data);
        }
      } catch (e) {
        console.error("Errore lettura layer ArcGIS:", e);
      }
    }

    controllaTerremoti();
    setInterval(controllaTerremoti, 15000);
  </script>
</body>
</html>

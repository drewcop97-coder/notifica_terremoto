<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Notifica Sismica ArcGIS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #status {
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
    }
    #status.nascosto {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="status" onclick="attivaAudio()">🔇 Clicca qui per abilitare l'audio</div>

  <script>
    const AUDIO_URL = "https://image2url.com";
    
    // Il tuo layer ArcGIS Proxy configurato
    const LAYER_URL = "https://utility.arcgis.com/usrsvcs/servers/7d902cfd09864a8290a6e211dd58a097/rest/services/EventsList/FeatureServer/2"; 

    // Chiede gli ultimi eventi ordinati per il campo ID (se disponibile) o senza filtro
    const queryUrl = `${LAYER_URL}/query?where=1%3D1&outFields=*&resultRecordCount=5&f=json`;
    
    const audio = new Audio(AUDIO_URL);
    audio.preload = 'auto';
    const statusBox = document.getElementById('status');
    
    let audioAbilitato = false;
    let firmaUltimiEventi = null;

    function attivaAudio() {
      statusBox.classList.add('nascosto');
      audio.muted = true;
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
        audioAbilitato = true;
      }).catch(err => {
        audio.muted = false;
        console.error("Errore audio:", err);
      });
    }

    async function controllaTerremoti() {
      try {
        const res = await fetch(queryUrl);
        const data = await res.json();
        
        if (data.features && data.features.length > 0) {
          // Crea una "firma" unica degli attributi dei record restituiti
          const firmaAttuale = JSON.stringify(data.features.map(f => f.attributes));
          
          // Se non è il primo caricamento e i dati sono cambiati -> NUOVO TERREMOTO -> SUONA!
          if (firmaUltimiEventi !== null && firmaAttuale !== firmaUltimiEventi) {
            if (audioAbilitato) {
              audio.currentTime = 0;
              audio.play().catch(e => console.error("Errore play:", e));
            } else {
              statusBox.classList.remove('nascosto');
            }
          }
          firmaUltimiEventi = firmaAttuale;
        }
      } catch (e) {
        console.error("Errore lettura layer ArcGIS:", e);
      }
    }

    // Primo controllo immediato e poi ogni 15 secondi
    controllaTerremoti();
    setInterval(controllaTerremoti, 15000);
  </script>
</body>
</html>

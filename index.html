<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Allerta Sismica</title>
  <style>
    body {
      margin: 0;
      padding: 15px;
      background-color: #d9534f;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    h2 { margin: 0; font-size: 18px; }
  </style>
</head>
<body>

  <div>
    <h2>⚠️ NUOVO EVENTO SISMICO RILEVATO</h2>
  </div>

  <script>
    const AUDIO_URL = "https://www.image2url.com/r2/default/audio/1795119985931-bfc559b7-1f06-4403-8735-f6deff3510d4.mp3";
    const audio = new Audio(AUDIO_URL);
    
    // Suona appena la finestra viene aperta
    window.addEventListener('DOMContentLoaded', () => {
      audio.play().catch(err => {
        console.log("Riproduzione bloccata: l'utente non ha ancora cliccato sull'app.", err);
      });
    });
  </script>

</body>
</html>
